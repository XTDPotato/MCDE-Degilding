plugins {
    id "fabric-loom" version "1.7-SNAPSHOT"
    id "maven-publish"
}

def targetMinecraft = providers.gradleProperty("targetMinecraft").orElse("1.20.1").get()
def targets = [
    "1.20.1": [
        minecraft: "1.20.1",
        yarn: "1.20.1+build.10",
        loader: "0.16.5",
        fabricApi: "0.92.2+1.20.1",
        mcdeJar: "mcde-1.6.4-1.20.jar",
        mcdeVersion: "1.6.4-1.20",
        java: 17
    ],
    "1.21.1": [
        minecraft: "1.21.1",
        yarn: "1.21.1+build.3",
        loader: "0.16.5",
        fabricApi: "0.116.17+1.21.1",
        mcdeJar: "mcde-1.6.4-1.21.jar",
        mcdeVersion: "1.6.4-1.21",
        java: 21
    ]
]
def target = targets[targetMinecraft]
if (target == null) {
    throw new GradleException("Unsupported targetMinecraft '${targetMinecraft}'. Supported targets: ${targets.keySet().join(', ')}")
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Aliyun Public"
        url = "https://maven.aliyun.com/repository/public"
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${target.minecraft}"
    mappings "net.fabricmc:yarn:${target.yarn}:v2"
    modImplementation "net.fabricmc:fabric-loader:${target.loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"

    modImplementation files("libs/${target.mcdeJar}")
}

base {
    archivesName = "${project.archives_base_name}-${targetMinecraft}"
}

sourceSets {
    main {
        java.srcDirs = targetMinecraft == "1.20.1"
            ? ["src/main/java"]
            : ["src/${targetMinecraft}/java"]
    }
}

processResources {
    inputs.properties([
        version: project.version,
        minecraft_version: target.minecraft,
        fabric_api_version: target.fabricApi,
        java_version: target.java,
        mcde_version: target.mcdeVersion
    ])

    filesMatching("fabric.mod.json") {
        expand inputs.properties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = target.java
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(target.java)
    targetCompatibility = JavaVersion.toVersion(target.java)
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
